name: Update creators.json

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build creators.json from Sheet
        env:
          SCRIPT_URL: ${{ secrets.SHEET_SCRIPT_URL }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: python3 scripts/sheet_to_creators_json.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh creators.json"
          file_pattern: creators.json
